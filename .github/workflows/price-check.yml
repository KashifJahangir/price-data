name: Price Checker

on:
  schedule:
    # Every Monday at 03:00 UTC (08:00 PKT).
    - cron: '0 3 * * 1'
  workflow_dispatch: {}   # manual trigger from the Actions tab

permissions:
  contents: write   # needed so the workflow can push the updated products.json

# Never run two price-check workflows at the same time
concurrency:
  group: price-update
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # confirmation re-reads make changed prices slower
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome (for Junaid Tech / Czone / Zah fallback)
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      # All stores run here, including Zah Computers.
      # If Cloudflare blocks GitHub's IPs, the script skips the rest of Zah
      # after 3 blocked products in a row and keeps the old Zah prices.
      # Look for "[shopino] ... blocked 3 times" in this step's log.
      - name: Run price checker
        run: python price_checker.py products.json --no-backup --delay 2

      - name: Commit and push if prices changed
        run: |
          git config user.name "price-checker-bot"
          git config user.email "actions@github.com"
          git add products.json
          if git diff --cached --quiet; then
            echo "No price changes to commit."
            exit 0
          fi
          git commit -m "Automated price update $(date -u +'%Y-%m-%d')"
          for i in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            echo "Push failed, retrying ($i/3)..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Push failed after 3 attempts."
          exit 1
