name: Price Checker

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome (for Junaid Tech / Czone scraping)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run price checker
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: python price_checker.py products.json --no-backup --delay 1.5 --debug

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-output
          path: |
            debug_html/
            debug_last_challenge.html
            debug_no_price.html
          if-no-files-found: ignore

      - name: Commit and push if prices changed
        run: |
          git config user.name "price-checker-bot"
          git config user.email "actions@github.com"
          git add products.json
          if git diff --cached --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "Automated price update $(date -u +'%Y-%m-%d')"
            git push
          fi
