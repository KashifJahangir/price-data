name: Price Checker

on:
  schedule:
    # Every day at 03:00 UTC (08:00 PKT) to cycle through categories automatically.
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      category:
        description: 'Select category to run manually (leave empty for daily auto-rotation)'
        required: false
        type: choice
        default: 'auto'
        options:
          - auto
          - graphics_cards
          - motherboards
          - processors
          - monitors
          - ram
          - storage
          - peripherals
          - powersupplies

permissions:
  contents: write   # needed so the workflow can push the updated products.json

# Never run two price-check workflows at the same time
concurrency:
  group: price-update
  cancel-in-progress: false

jobs:
  update-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # confirmation re-reads make changed prices slower
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome (for Junaid Tech / Czone / Zah fallback)
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies and virtual display (xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install -r requirements.txt

      - name: Determine Target Category
        run: |
          python -c '
          import json, datetime, os

          with open("products.json", "r") as f:
              data = json.load(f)

          valid_categories = [c["id"] for c in data.get("categories", []) if c.get("productCount", 0) > 0]
          
          # Check if a manual category was selected via workflow_dispatch
          manual_cat = "${{ github.event.inputs.category }}"
          
          if manual_cat and manual_cat != "auto":
              selected_category = manual_cat
              print(f"Manual trigger selected category: {selected_category}")
          else:
              # Automatic daily rotation cycle
              if not valid_categories:
                  print("No valid categories with products found in products.json!")
                  exit(1)
              total_days = datetime.datetime.utcnow().toordinal()
              cat_index = total_days % len(valid_categories)
              selected_category = valid_categories[cat_index]
              print(f"Automatic schedule selected category: {selected_category} (Index {cat_index}/{len(valid_categories)-1})")
          
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"TARGET_CATEGORY={selected_category}\n")
          '

      # Zah Computers is skipped because Cloudflare strictly blocks GitHub's data center IPs.
      # The rest of the stores (Junaid Tech, AMD House, etc.) will update normally for the selected category.
      - name: Run price checker for category
        # xvfb-run creates a fake monitor so the headed Chrome browser doesn't crash
        run: xvfb-run python price_checker.py products.json --no-backup --delay 2 --skip-store zah --category-id "$TARGET_CATEGORY"

      - name: Commit and push if prices changed
        run: |
          git config user.name "price-checker-bot"
          git config user.email "actions@github.com"
          git add products.json
          if git diff --cached --quiet; then
            echo "No price changes to commit."
            exit 0
          fi
          git commit -m "Automated price update for category: $TARGET_CATEGORY ($(date -u +'%Y-%m-%d'))"
          for i in 1 2 3; do
            if git pull --rebase && git push; then
              exit 0
            fi
            echo "Push failed, retrying ($i/3)..."
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          echo "Push failed after 3 attempts."
          exit 1
