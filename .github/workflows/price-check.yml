name: Price Checker

on:
  schedule:
    # Every Monday at 03:00 UTC (08:00 PKT).
    - cron: '0 3 * * 1'
  workflow_dispatch: {}   # manual trigger from the Actions tab

permissions:
  contents: write   # needed so the workflow can push the updated products.json

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Chrome (for Junaid Tech / Czone scraping)
        uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Zah Computers is skipped here: its Cloudflare blocks GitHub's
      # datacenter IPs with 403. Zah is updated separately by running
      # run_price_check.bat on a local PC (uses --store zah).
      - name: Run price checker
        run: python price_checker.py products.json --no-backup --delay 2 --skip-store zah

      - name: Commit and push if prices changed
        run: |
          git config user.name "price-checker-bot"
          git config user.email "actions@github.com"
          git add products.json
          if git diff --cached --quiet; then
            echo "No price changes to commit."
          else
            git commit -m "Automated price update $(date -u +'%Y-%m-%d')"
            git push
          fi
